  /admin/senalamientos/{id}/resolucion:
    post:
      tags:
      - Administración técnica
      operationId: resolverSenalamiento
      summary: Desestimar o suspender la cuenta
      description: Al suspender se avisa al ciudadano y se registra la decisión; los reportes no se modifican.
      x-casos-uso:
      - CU-26
      x-requisitos:
      - RF-043
      x-roles:
      - administrador
      x-alcance: MVP
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolucionSenalamiento'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Senalamiento'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Folio:
      name: folio
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Folio'
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Tamano:
      name: tamano
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Invalido:
      description: Datos inválidos (codigo VALIDACION, con detalles por campo).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Falta la sesión o expiró.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Prohibido:
      description: El rol o la organización no permiten la operación, o la cuenta está suspendida (codigo CUENTA_SUSPENDIDA).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: No existe o no pertenece al ámbito del usuario (no se revela cuál de los dos).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: 'Conflicto con el estado actual. Ej.: TRANSICION_INVALIDA, YA_REABIERTO, CORREO_REGISTRADO.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoProcesable:
      description: 'Regla de negocio no cumplida. Ej.: FUERA_DE_COBERTURA, TELEFONO_REQUERIDO, PLAZO_VENCIDO.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Limite:
      description: Límite preventivo excedido (codigo LIMITE_EXCEDIDO; RNF-009, RNF-022). Se informa como medida
        temporal.
      headers:
        Retry-After:
          description: Segundos para reintentar.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
          description: 'Código estable para que el frontend decida qué mostrar. Ej.: TRANSICION_INVALIDA, FUERA_DE_COBERTURA,
            CUENTA_SUSPENDIDA.'
        mensaje:
          type: string
          description: Mensaje legible, redactado como medida preventiva cuando aplica (RNF-022).
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              problema:
                type: string
          description: Errores por campo en validaciones (400).
      required:
      - codigo
      - mensaje
    EstadoReporte:
      type: string
      enum:
      - pendiente_canalizacion
      - recibido
      - validado
      - asignado
      - en_atencion
      - resuelto
      - reabierto
      - rechazado
      - duplicado
      - canalizacion_externa
      description: Estados del Anexo G. Las transiciones válidas son las del diagrama Estados_TAAN.
    Rol:
      type: string
      enum:
      - ciudadano
      - personal_area
      - coordinacion
      - administrador
    MotivoCanalizacion:
      type: string
      enum:
      - regla
      - sin_regla
      - empate_reglas
      - sin_clasificacion
      - redireccion
    MotivoRechazo:
      type: string
      enum:
      - no_corresponde
      - informacion_insuficiente
      - ya_atendido
      - no_servicio_publico
    NivelParticipacion:
      type: string
      enum:
      - integrada
      - conectada
      - externa
      description: «conectada» corresponde a una iteración posterior al MVP.
    Semaforo:
      type: string
      enum:
      - verde
      - amarillo
      - rojo
      - sin_tiempo
      description: 'Calculado con los tiempos objetivo de la organización (RF-041). sin_tiempo: el estado no tiene
        tiempo configurado.'
    TipoCanal:
      type: string
      enum:
      - telefono
      - sitio_web
      - correo
      - otro
    Telefono:
      type: string
      pattern: ^[0-9]{10}$
      example: '2721234567'
      description: 10 dígitos, sin espacios ni guiones (RF-038).
    Folio:
      type: string
      pattern: ^[A-Z0-9-]{6,20}$
      example: IXT-2026-000123
    Ubicacion:
      type: object
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
      required:
      - latitud
      - longitud
    GeoJsonPoligono:
      type: object
      properties:
        type:
          type: string
          enum:
          - Polygon
          - MultiPolygon
        coordinates:
          type: array
          items: {}
          description: Coordenadas GeoJSON en WGS84 (EPSG:4326), longitud primero.
      required:
      - type
      - coordinates
      description: Geometría GeoJSON; se guarda en PostGIS como MultiPolygon.
    Sesion:
      type: object
      properties:
        accessToken:
          type: string
          description: 'JWT de corta duración; se envía como «Authorization: Bearer».'
        refreshToken:
          type: string
        expiraEn:
          type: integer
          description: Segundos de vigencia del accessToken.
        rol:
          $ref: '#/components/schemas/Rol'
        requiereTelefono:
          type: boolean
          description: 'Solo ciudadanos: true si falta el teléfono en el perfil (primer ingreso con Google).'
        requiereCambioPassword:
          type: boolean
          description: 'Solo institucionales: true si la credencial es temporal.'
      required:
      - accessToken
      - refreshToken
      - expiraEn
      - rol
    RegistroCorreo:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 150
        correo:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 72 es el máximo que admite BCrypt.
        aceptaAvisoPrivacidad:
          type: boolean
          enum:
          - true
        captchaToken:
          type: string
          description: Token del CAPTCHA de baja fricción (RNF-022).
        campoAuxiliar:
          type: string
          maxLength: 0
          description: 'Campo trampa (honeypot): debe llegar vacío.'
      required:
      - nombre
      - correo
      - password
      - aceptaAvisoPrivacidad
      - captchaToken
    LoginGoogle:
      type: object
      properties:
        idToken:
          type: string
          description: ID token emitido por Google Sign-In (OpenID Connect); el backend verifica firma y audiencia.
        captchaToken:
          type: string
          description: Obligatorio solo si el correo aún no tiene cuenta (se crea en este paso, CU-24).
        aceptaAvisoPrivacidad:
          type: boolean
          description: Obligatorio solo al crear la cuenta.
      required:
      - idToken
    LoginCorreo:
      type: object
      properties:
        correo:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
      - correo
      - password
    TokenVerificacion:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    SolicitudCorreo:
      type: object
      properties:
        correo:
          type: string
          format: email
      required:
      - correo
    Restablecimiento:
      type: object
      properties:
        token:
          type: string
        nuevaPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
      required:
      - token
      - nuevaPassword
    CambioPassword:
      type: object
      properties:
        passwordActual:
          type: string
          format: password
        nuevaPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
      required:
      - passwordActual
      - nuevaPassword
    RefrescoSesion:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    CierreSesion:
      type: object
      properties:
        tokenDispositivo:
          type: string
          description: Si se envía, se elimina la suscripción de avisos de ese dispositivo (RF-034).
    Perfil:
      type: object
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
        metodoAcceso:
          type: string
          enum:
          - google
          - correo
        telefono:
          allOf:
          - $ref: '#/components/schemas/Telefono'
          nullable: true
        avisosCorreo:
          type: boolean
        estado:
          type: string
          enum:
          - activa
          - suspendida
        suspension:
          type: object
          properties:
            motivo:
              type: string
            hasta:
              type: string
              format: date-time
              nullable: true
              description: null = suspensión indefinida.
          nullable: true
      required:
      - nombre
      - correo
      - metodoAcceso
      - avisosCorreo
      - estado
    PerfilActualizacion:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 150
        telefono:
          $ref: '#/components/schemas/Telefono'
        avisosCorreo:
          type: boolean
      description: Todos los campos son opcionales; solo se cambian los enviados.
    EliminacionCuenta:
      type: object
      properties:
        confirmacion:
          type: string
          enum:
          - ELIMINAR
          description: Confirmación explícita (RF-012).
      required:
      - confirmacion
    Dispositivo:
      type: object
      properties:
        tokenDispositivo:
          type: string
          maxLength: 500
          description: Token de Firebase Cloud Messaging.
      required:
      - tokenDispositivo
    Cobertura:
      type: object
      properties:
        dentroDeCobertura:
          type: boolean
        zona:
          type: string
          nullable: true
      required:
      - dentroDeCobertura
    DatosNuevoReporte:
      type: object
      properties:
        descripcion:
          type: string
          minLength: 15
          maxLength: 2000
          description: Lenguaje natural; nunca se sobrescribe.
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        origen:
          type: string
          enum:
          - web
          - app
        campoAuxiliar:
          type: string
          maxLength: 0
          description: 'Campo trampa (honeypot): debe llegar vacío.'
      required:
      - descripcion
      - ubicacion
      - origen
    ReporteCreado:
      type: object
      properties:
        folio:
          $ref: '#/components/schemas/Folio'
        estado:
          $ref: '#/components/schemas/EstadoReporte'
        estadoTexto:
          type: string
          example: En revisión
        creadoEn:
          type: string
          format: date-time
      required:
      - folio
      - estado
      - estadoTexto
      - creadoEn
    ArchivoRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: Ruta de GET /archivos/{id}.
        tipoMime:
          type: string
      required:
      - id
      - url
      - tipoMime
    EventoPublico:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoReporte'
        estadoTexto:
          type: string
        descripcion:
          type: string
      required:
      - fecha
      - estado
      - estadoTexto
    CanalExterno:
      type: object
      properties:
        id:
          type: integer
          format: int64
        organizacionId:
          type: integer
          format: int64
        organizacion:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoCanal'
        valor:
          type: string
        fuenteVerificacion:
          type: string
        activo:
          type: boolean
      required:
      - id
      - organizacionId
      - tipo
      - valor
      - fuenteVerificacion
      - activo
    ReporteResumenCiudadano:
      type: object
      properties:
        folio:
          $ref: '#/components/schemas/Folio'
        estado:
          $ref: '#/components/schemas/EstadoReporte'
        estadoTexto:
          type: string
          description: Pendiente de canalización se muestra como «En revisión».
        categoria:
          type: string
          nullable: true
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
      required:
      - folio
      - estado
      - estadoTexto
      - creadoEn
      - actualizadoEn
    ReporteDetalleCiudadano:
      allOf:
      - $ref: '#/components/schemas/ReporteResumenCiudadano'
      - type: object
        properties:
          descripcion:
            type: string
          ubicacion:
            $ref: '#/components/schemas/Ubicacion'
          fotos:
            type: array
            items:
              $ref: '#/components/schemas/ArchivoRef'
          organizacion:
            type: string
            nullable: true
          area:
            type: string
            nullable: true
          historial:
            type: array
            items:
              $ref: '#/components/schemas/EventoPublico'
            description: Solo eventos visibles para el ciudadano.
          rechazo:
            type: object
            properties:
              motivo:
                $ref: '#/components/schemas/MotivoRechazo'
              texto:
                type: string
                nullable: true
              contactoArea:
                type: object
                properties:
                  telefono:
                    type: string
                    nullable: true
                  correo:
                    type: string
                    nullable: true
            description: Presente si estado = rechazado (RF-013).
            nullable: true
          reportePrincipal:
            type: object
            properties:
              folio:
                $ref: '#/components/schemas/Folio'
              estado:
                $ref: '#/components/schemas/EstadoReporte'
              estadoTexto:
                type: string
              historial:
                type: array
                items:
                  $ref: '#/components/schemas/EventoPublico'
            description: 'Presente si estado = duplicado: el ciudadano sigue el avance del principal.'
            nullable: true
          canalesExternos:
            type: array
            items:
              $ref: '#/components/schemas/CanalExterno'
            description: Presente si estado = canalizacion_externa (CU-03).
          reapertura:
            type: object
            properties:
              permitida:
                type: boolean
              venceEn:
                type: string
                format: date-time
                nullable: true
            description: Presente si estado = resuelto (RF-042).
            nullable: true
    Reapertura:
      type: object
      properties:
        motivo:
          type: string
          minLength: 10
          maxLength: 1000
          description: Por qué el problema persiste.
      required:
      - motivo
    ReporteResumenInstitucional:
      type: object
      properties:
        folio:
          $ref: '#/components/schemas/Folio'
        estado:
          $ref: '#/components/schemas/EstadoReporte'
        categoria:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        creadoEn:
          type: string
          format: date-time
        fechaUltimoEstado:
          type: string
          format: date-time
        semaforo:
          $ref: '#/components/schemas/Semaforo'
        posibleContenidoNoValido:
          type: boolean
          description: Marca informativa de la IA; no rechaza el reporte.
        contadorDuplicados:
          type: integer
          description: '«Reportado por N personas»: reportes que apuntan a este como principal.'
        reabierto:
          type: boolean
      required:
      - folio
      - estado
      - creadoEn
      - fechaUltimoEstado
      - semaforo
      - posibleContenidoNoValido
      - contadorDuplicados
      - reabierto
    Usuarioref:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
      required:
      - id
      - nombre
    EventoHistorial:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
        accion:
          type: string
          example: redireccion
        estadoAnterior:
          allOf:
          - $ref: '#/components/schemas/EstadoReporte'
          nullable: true
        estadoNuevo:
          allOf:
          - $ref: '#/components/schemas/EstadoReporte'
          nullable: true
        organizacionAnterior:
          type: string
          nullable: true
        organizacionNueva:
          type: string
          nullable: true
        areaAnterior:
          type: string
          nullable: true
        areaNueva:
          type: string
          nullable: true
        observaciones:
          type: string
          nullable: true
        visibleCiudadano:
          type: boolean
        usuario:
          allOf:
          - $ref: '#/components/schemas/Usuarioref'
          nullable: true
      required:
      - fecha
      - accion
      - visibleCiudadano
      description: Registro inmutable del historial (RF-017).
    ReporteDetalleInstitucional:
      allOf:
      - $ref: '#/components/schemas/ReporteResumenInstitucional'
      - type: object
        properties:
          descripcion:
            type: string
          ubicacion:
            $ref: '#/components/schemas/Ubicacion'
          fotos:
            type: array
            items:
              $ref: '#/components/schemas/ArchivoRef'
          evidenciasAtencion:
            type: array
            items:
              $ref: '#/components/schemas/ArchivoRef'
            description: Evidencia que adjunta el personal (CU-18), separada de las fotos del ciudadano (RF-023).
          ciudadano:
            type: object
            properties:
              nombre:
                type: string
              telefono:
                $ref: '#/components/schemas/Telefono'
            description: Solo para personal de la organización responsable (RF-038); null si la cuenta fue
              eliminada o en la respuesta de una redirección.
            nullable: true
          categoriaSugerida:
            type: string
            nullable: true
            description: Propuesta de la IA.
          categoriaFinal:
            type: string
            nullable: true
          motivoCanalizacion:
            allOf:
            - $ref: '#/components/schemas/MotivoCanalizacion'
            nullable: true
          organizacion:
            type: string
            nullable: true
          reportePrincipalFolio:
            allOf:
            - $ref: '#/components/schemas/Folio'
            nullable: true
          historial:
            type: array
            items:
              $ref: '#/components/schemas/EventoHistorial'
    Validacion:
      type: object
      properties:
        categoriaFinalId:
          type: integer
          format: int64
          description: 'Opcional: confirma o corrige la categoría de la IA.'
    Rechazo:
      type: object
      properties:
        motivoPublico:
          $ref: '#/components/schemas/MotivoRechazo'
        textoPublico:
          type: string
          maxLength: 500
        justificacion:
          type: string
          minLength: 10
          maxLength: 2000
          description: Interna; no la ve el ciudadano.
      required:
      - motivoPublico
      - justificacion
    MarcaDuplicado:
      type: object
      properties:
        folioPrincipal:
          $ref: '#/components/schemas/Folio'
        observaciones:
          type: string
          minLength: 5
          maxLength: 2000
      required:
      - folioPrincipal
      - observaciones
    Asignacion:
      type: object
      properties:
        areaId:
          type: integer
          format: int64
        justificacion:
          type: string
          maxLength: 2000
          description: Obligatoria cuando es reasignación (estado asignado).
      required:
      - areaId
    Resolucion:
      type: object
      properties:
        observacionCierre:
          type: string
          minLength: 5
          maxLength: 2000
      required:
      - observacionCierre
    Redireccion:
      type: object
      properties:
        organizacionDestinoId:
          type: integer
          format: int64
        categoriaFinalId:
          type: integer
          format: int64
          nullable: true
          description: Confirma o corrige la categoría, igual que en la validación (CU-21 paso 3).
        justificacion:
          type: string
          minLength: 10
          maxLength: 2000
      required:
      - organizacionDestinoId
      - justificacion
    OrganizacionResumen:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        nivelParticipacion:
          $ref: '#/components/schemas/NivelParticipacion'
      required:
      - id
      - nombre
      - nivelParticipacion
    SolicitudSenalamiento:
      type: object
      properties:
        motivo:
          type: string
          minLength: 10
          maxLength: 2000
      required:
      - motivo
    ReporteMapa:
      type: object
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
        features:
          type: array
          items:
            type: object
            properties: {}
      required:
      - type
      - features
      description: GeoJSON con un punto por reporte (iteración posterior).
    Conteo:
      type: object
      properties:
        etiqueta:
          type: string
        total:
          type: integer
      required:
      - etiqueta
      - total
    Estadisticas:
      type: object
      properties:
        periodoInicio:
          type: string
          format: date
        periodoFin:
          type: string
          format: date
        porEstado:
          type: array
          items:
            $ref: '#/components/schemas/Conteo'
        porCategoria:
          type: array
          items:
            $ref: '#/components/schemas/Conteo'
        porArea:
          type: array
          items:
            $ref: '#/components/schemas/Conteo'
        porZona:
          type: array
          items:
            $ref: '#/components/schemas/Conteo'
        tiempoPromedioAtencionHoras:
          type: number
          nullable: true
        enTiempo:
          type: integer
        atrasados:
          type: integer
        reabiertos:
          type: integer
      required:
      - periodoInicio
      - periodoFin
      - porEstado
      - porCategoria
      - porArea
      - porZona
      - enTiempo
      - atrasados
      - reabiertos
      description: Sin datos personales de ciudadanos (RF-026).
    SolicitudInforme:
      type: object
      properties:
        periodoInicio:
          type: string
          format: date
        periodoFin:
          type: string
          format: date
        areaId:
          type: integer
          format: int64
          description: Omitir para toda la organización.
        formato:
          type: string
          enum:
          - pdf
          - hoja_calculo
      required:
      - periodoInicio
      - periodoFin
      - formato
    Area:
