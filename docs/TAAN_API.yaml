openapi: 3.0.3
info:
  title: T'AAN - API REST
  version: 1.0.0
  description: 'Contrato de la API de T''AAN, plataforma inteligente de reportes y gestión ciudadana. Lo usan la
    web (Angular) y la app móvil (Ionic) por igual.


    **Convenciones**


    - Todas las rutas cuelgan de `/api/v1`. Los nombres de campos están en camelCase.

    - Autenticación con JWT: `Authorization: Bearer <accessToken>`. Las operaciones públicas lo indican.

    - `x-roles`: quién puede invocar la operación. `x-casos-uso` y `x-requisitos`: trazabilidad con el documento
    maestro.

    - `x-alcance`: MVP o Posterior (iteración posterior al MVP).

    - Las transiciones de estado son operaciones explícitas (validacion, rechazo, asignacion, etc.) y solo se aceptan
    si existen en el diagrama de estados (Estados_TAAN); de lo contrario responden 409 TRANSICION_INVALIDA.

    - Los errores siguen el esquema `Error`; el campo `codigo` es estable para que el frontend decida qué mostrar.

    - Paginación con `pagina` (desde 0) y `tamano` (máximo 100).'
servers:
- url: http://localhost:8080/api/v1
  description: Desarrollo local
- url: https://{dominio}/api/v1
  description: Despliegue (Oracle Cloud)
  variables:
    dominio:
      default: taan.example.mx
tags:
- name: Autenticación
  description: Registro e inicio de sesión de ciudadanos (Google o correo) y del personal institucional.
- name: Cuenta ciudadana
  description: Perfil, teléfono, avisos, dispositivos y eliminación de cuenta.
- name: Reportes ciudadanos
  description: Registrar reportes y darles seguimiento desde «Mis reportes».
- name: Archivos
  description: Descarga controlada de fotografías y evidencias.
- name: Atención institucional
  description: Bandeja, transiciones de estado, redirección y señalamientos.
- name: Estadísticas e informes
  description: Indicadores y exportación sin datos personales.
- name: Configuración institucional
  description: Lo que configura la coordinación de cada organización.
- name: Administración técnica
  description: Lo que configura el administrador de T'AAN.
security:
- bearerAuth: []
paths:
  /auth/ciudadanos/registro:
    post:
      tags:
      - Autenticación
      operationId: registrarCiudadanoCorreo
      summary: Crear cuenta ciudadana con correo
      description: Envía un enlace de verificación; la cuenta no puede reportar hasta confirmarlo.
      x-casos-uso:
      - CU-24
      x-requisitos:
      - RF-001
      - RNF-022
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCorreo'
      responses:
        '202':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/Limite'
  /auth/ciudadanos/verificacion:
    post:
      tags:
      - Autenticación
      operationId: verificarCorreo
      summary: Confirmar el enlace de verificación
      description: NoProcesable con codigo ENLACE_VENCIDO si el enlace expiró (EX-02).
      x-casos-uso:
      - CU-24
      x-requisitos:
      - RF-001
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerificacion'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '422':
          $ref: '#/components/responses/NoProcesable'
  /auth/ciudadanos/verificacion/reenvio:
    post:
      tags:
      - Autenticación
      operationId: reenviarVerificacion
      summary: Reenviar el enlace de verificación
      description: Responde igual exista o no la cuenta, para no revelar correos registrados.
      x-casos-uso:
      - CU-24
      x-requisitos:
      - RF-001
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCorreo'
      responses:
        '202':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '429':
          $ref: '#/components/responses/Limite'
  /auth/ciudadanos/google:
    post:
      tags:
      - Autenticación
      operationId: accederConGoogle
      summary: Continuar con Google (registro o inicio de sesión)
      description: Si el correo no tiene cuenta, la crea (requiere captchaToken y aceptaAvisoPrivacidad). requiereTelefono
        = true indica que debe completar el teléfono antes de reportar (CU-04 FA-03).
      x-casos-uso:
      - CU-24
      - CU-04
      x-requisitos:
      - RF-001
      - RF-002
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginGoogle'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/Invalido'
        '429':
          $ref: '#/components/responses/Limite'
  /auth/ciudadanos/sesion:
    post:
      tags:
      - Autenticación
      operationId: iniciarSesionCiudadano
      summary: Iniciar sesión ciudadana con correo
      description: Credenciales incorrectas responden 400 con un mensaje que no revela si el correo existe.
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-002
      - RNF-009
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCorreo'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/Invalido'
        '429':
          $ref: '#/components/responses/Limite'
  /auth/ciudadanos/recuperacion:
    post:
      tags:
      - Autenticación
      operationId: solicitarRecuperacion
      summary: Solicitar restablecimiento de contraseña
      description: Solo cuentas de correo. Responde igual exista o no la cuenta.
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-002
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCorreo'
      responses:
        '202':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '429':
          $ref: '#/components/responses/Limite'
  /auth/ciudadanos/recuperacion/confirmacion:
    post:
      tags:
      - Autenticación
      operationId: restablecerPassword
      summary: Restablecer contraseña con el enlace
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-002
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Restablecimiento'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '422':
          $ref: '#/components/responses/NoProcesable'
  /auth/institucional/sesion:
    post:
      tags:
      - Autenticación
      operationId: iniciarSesionInstitucional
      summary: Iniciar sesión institucional
      description: requiereCambioPassword = true obliga a cambiar la credencial temporal.
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-002
      - RF-003
      - RNF-009
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCorreo'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/Invalido'
        '429':
          $ref: '#/components/responses/Limite'
  /auth/institucional/password:
    put:
      tags:
      - Autenticación
      operationId: cambiarPasswordInstitucional
      summary: Cambiar contraseña institucional
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-002
      x-roles:
      - personal_area
      - coordinacion
      - administrador
      x-alcance: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPassword'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /auth/refresco:
    post:
      tags:
      - Autenticación
      operationId: refrescarSesion
      summary: Renovar el token de acceso
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-002
      x-roles:
      - publico
      x-alcance: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefrescoSesion'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/Invalido'
        '422':
          $ref: '#/components/responses/NoProcesable'
  /auth/cierre:
    post:
      tags:
      - Autenticación
      operationId: cerrarSesion
      summary: Cerrar sesión
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-031
      - RF-034
      x-roles:
      - ciudadano
      - personal_area
      - coordinacion
      - administrador
      x-alcance: MVP
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CierreSesion'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /ciudadano/perfil:
    get:
      tags:
      - Cuenta ciudadana
      operationId: obtenerPerfil
      summary: Consultar el perfil
      x-casos-uso:
      - CU-25
      x-requisitos:
      - RF-012
      x-roles:
      - ciudadano
      x-alcance: MVP
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    patch:
      tags:
      - Cuenta ciudadana
      operationId: actualizarPerfil
      summary: Corregir nombre, teléfono o avisos por correo
      x-casos-uso:
      - CU-25
      x-requisitos:
      - RF-012
      - RF-038
      - RF-044
      x-roles:
      - ciudadano
      x-alcance: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilActualizacion'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /ciudadano/password:
    put:
      tags:
      - Cuenta ciudadana
      operationId: cambiarPasswordCiudadano
      summary: Cambiar contraseña
      description: Solo cuentas de correo; las de Google responden NoProcesable (CU-25 FA-01).
      x-casos-uso:
      - CU-25
      x-requisitos:
      - RF-012
      x-roles:
      - ciudadano
      x-alcance: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPassword'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/NoProcesable'
  /ciudadano/cuenta/eliminacion:
    post:
      tags:
      - Cuenta ciudadana
      operationId: eliminarCuenta
      summary: Eliminar la cuenta
      description: Borra perfil, teléfono y suscripciones; los reportes se conservan desvinculados (CU-25 FA-02).
      x-casos-uso:
      - CU-25
      x-requisitos:
      - RF-012
      x-roles:
      - ciudadano
      x-alcance: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EliminacionCuenta'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /ciudadano/dispositivos:
    post:
      tags:
      - Cuenta ciudadana
      operationId: registrarDispositivo
      summary: Registrar el dispositivo para avisos push
      x-casos-uso:
      - CU-04
      x-requisitos:
      - RF-034
      x-roles:
      - ciudadano
      x-alcance: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dispositivo'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /ciudadano/dispositivos/baja:
    post:
      tags:
      - Cuenta ciudadana
      operationId: eliminarDispositivo
      summary: Dejar de recibir avisos en un dispositivo
      x-casos-uso:
      - CU-25
      x-requisitos:
      - RF-034
      x-roles:
      - ciudadano
      x-alcance: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dispositivo'
      responses:
        '204':
          description: Operación realizada.
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /cobertura:
    get:
      tags:
      - Reportes ciudadanos
      operationId: verificarCobertura
      summary: Verificar si una ubicación está en cobertura
      description: Se consulta antes de enviar, para avisar al ciudadano que la zona aún no tiene cobertura (EX-05).
      x-casos-uso:
      - CU-01
      x-requisitos:
      - RF-014
      - RF-029
      x-roles:
      - ciudadano
      x-alcance: MVP
      parameters:
      - name: latitud
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: longitud
        in: query
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cobertura'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /ciudadano/reportes:
    post:
      tags:
      - Reportes ciudadanos
      operationId: crearReporte
      summary: Registrar un reporte
      description: 'Responde de inmediato con el folio; la interpretación con IA (RF-007, RF-008) y la canalización
        por reglas (RF-015) se ejecutan después de forma asíncrona (RNF-011), sin operación propia. NoProcesable:
        FUERA_DE_COBERTURA o TELEFONO_REQUERIDO. Prohibido: CUENTA_SUSPENDIDA.'
      x-casos-uso:
      - CU-01
      x-requisitos:
      - RF-004
      - RF-005
      - RF-006
      - RF-011
      - RF-038
      - RNF-022
      - RF-007
      - RF-008
      - RF-015
      x-roles:
      - ciudadano
      x-alcance: MVP
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                datos:
                  $ref: '#/components/schemas/DatosNuevoReporte'
                fotos:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 3
                  description: Opcionales; se les quitan los metadatos GPS (RNF-017).
              required:
              - datos
            encoding:
              datos:
                contentType: application/json
              fotos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteCreado'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/Limite'
    get:
      tags:
      - Reportes ciudadanos
      operationId: listarMisReportes
      summary: Mis reportes
      x-casos-uso:
      - CU-02
      x-requisitos:
      - RF-013
      - RF-040
      x-roles:
      - ciudadano
      x-alcance: MVP
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReporteResumenCiudadano'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /ciudadano/reportes/{folio}:
    get:
      tags:
      - Reportes ciudadanos
      operationId: obtenerMiReporte
      summary: Detalle de un reporte propio
      description: Incluye el seguimiento del reporte principal si es duplicado, el motivo y el contacto del área
        si fue rechazado, y los canales oficiales si la canalización es externa.
      x-casos-uso:
      - CU-02
      - CU-03
      x-requisitos:
      - RF-013
      - RF-016
      - RF-035
      x-roles:
      - ciudadano
      x-alcance: MVP
      parameters:
      - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteDetalleCiudadano'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /ciudadano/reportes/{folio}/reapertura:
    post:
      tags:
      - Reportes ciudadanos
      operationId: reabrirReporte
      summary: Reabrir un reporte resuelto
      description: 'Transición Resuelto → Reabierto, en la misma área. Conflicto: YA_REABIERTO,
        YA_CONFIRMADO (el ciudadano ya confirmó la resolución) o TRANSICION_INVALIDA. NoProcesable:
        PLAZO_VENCIDO. Prohibido: CUENTA_SUSPENDIDA.'
      x-casos-uso:
      - CU-23
      x-requisitos:
      - RF-042
      x-roles:
      - ciudadano
      x-alcance: MVP
      parameters:
      - $ref: '#/components/parameters/Folio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reapertura'
      responses:
        '200':
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteDetalleCiudadano'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoProcesable'
  /ciudadano/reportes/{folio}/confirmacion:
    post:
      tags:
      - Reportes ciudadanos
      operationId: confirmarResolucion
      summary: Confirmar que el problema se resolvió
      description: 'Registra la confirmación en el historial (CU-23 FA-01); el reporte permanece Resuelto
        y ya no puede reabrirse. Conflicto: TRANSICION_INVALIDA (no está Resuelto) o YA_CONFIRMADO.
        Prohibido: CUENTA_SUSPENDIDA.'
      x-casos-uso:
      - CU-23
      x-requisitos:
      - RF-042
      x-roles:
      - ciudadano
      x-alcance: MVP
      parameters:
      - $ref: '#/components/parameters/Folio'
      responses:
        '204':
          description: Operación realizada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
  /archivos/{id}:
    get:
      tags:
      - Archivos
      operationId: descargarArchivo
      summary: Descargar una fotografía o evidencia
      description: El ciudadano solo accede a las de sus reportes; el personal, a las de su organización.
      x-casos-uso:
      - CU-02
      - CU-05
      x-requisitos:
      - RNF-017
      x-roles:
      - ciudadano
      - personal_area
      - coordinacion
      x-alcance: MVP
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Operación realizada.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /institucional/reportes:
    get:
      tags:
      - Atención institucional
      operationId: buscarReportes
      summary: Bandeja y búsqueda de reportes
