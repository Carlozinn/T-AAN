# =====================================================================
# T'AAN - configuración del backend
# Los secretos NUNCA se escriben aquí: se leen de variables de entorno.
# =====================================================================
server:
  port: 8080
  servlet:
    context-path: /api/v1          # todas las rutas del contrato cuelgan de /api/v1

spring:
  application:
    name: taan-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taan}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:taan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate           # el esquema lo manda Flyway; Hibernate solo verifica
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true                  # ejecuta db/migration/V1__esquema_inicial.sql al arrancar
  servlet:
    multipart:
      max-file-size: 5MB           # por fotografía
      max-request-size: 20MB       # reporte completo (hasta 3 fotografías)

taan:
  jwt:
    secreto: ${TAAN_JWT_SECRETO}   # obligatorio, al menos 32 caracteres
    minutos-acceso: 15
    dias-refresco: 30
    horas-verificacion: 24         # vigencia del enlace de verificación de correo (CU-24)
    minutos-recuperacion: 60       # vigencia del enlace para restablecer la contraseña (CU-04)
  cifrado:
    clave: ${TAAN_CIFRADO_CLAVE}   # obligatoria: 32 bytes en Base64 (AES-256-GCM) para el teléfono
  limites:                         # intentos de inicio de sesión por cuenta y por origen (RNF-009)
    intentos-fallidos: 5
    ventana-minutos: 15
  web:
    url: ${TAAN_WEB_URL:http://localhost:4200}   # base de los enlaces que viajan por correo
  google:
    client-id: ${GOOGLE_CLIENT_ID:}              # vacío = «Continuar con Google» deshabilitado
  admin:
    correo: ${TAAN_ADMIN_CORREO:admin@taan.mx}
    password: ${TAAN_ADMIN_PASSWORD:} # solo se usa la primera vez, para crear la cuenta
  cors:
    origenes: http://localhost:4200,http://localhost:8100,capacitor://localhost,https://localhost
  ia:
    timeout-segundos: ${TAAN_IA_TIMEOUT_SEGUNDOS:15}   # por llamada a cada proveedor
    intentos-maximos: ${TAAN_IA_INTENTOS_MAXIMOS:3}    # si fallan ambos proveedores, se reintenta (RF-007)
    gemini:
      api-key: ${GEMINI_API_KEY:}
      modelo: ${GEMINI_MODELO:gemini-flash-lite-latest}   # verificar el código vigente en Google AI Studio
    groq:
      api-key: ${GROQ_API_KEY:}
      modelo: ${GROQ_MODELO:openai/gpt-oss-120b}      # verificar el modelo vigente en la consola de Groq
  captcha:
    secreto: ${TURNSTILE_SECRETO:}
  archivos:
    directorio: ${TAAN_ARCHIVOS:./archivos}
