<main class="contenedor">
  <h1>Inicia sesión</h1>
  <div class="tarjeta">
    @if (error(); as mensaje) {
      <p class="aviso-error" role="alert">{{ mensaje }}</p>
    }
    <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input
          id="correo"
          type="email"
          formControlName="correo"
          autocomplete="email"
          aria-describedby="correo-error"
          [attr.aria-invalid]="formulario.controls.correo.touched && formulario.controls.correo.invalid"
        />
        <taan-error-campo id="correo-error" [control]="formulario.controls.correo" />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          aria-describedby="password-error"
          [attr.aria-invalid]="formulario.controls.password.touched && formulario.controls.password.invalid"
        />
        <taan-error-campo id="password-error" [control]="formulario.controls.password" />
      </div>
      <button class="boton" type="submit" [disabled]="enviando()">{{ enviando() ? 'Entrando…' : 'Entrar' }}</button>
    </form>
    <p><a routerLink="/recuperacion">¿Olvidaste tu contraseña?</a></p>
    <p>¿Aún no tienes cuenta? <a routerLink="/registro">Crea una</a></p>
  </div>
</main>
